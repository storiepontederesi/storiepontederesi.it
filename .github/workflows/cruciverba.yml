# Ogni venerdi pubblica il nuovo episodio del Cruciverba Pontederese:
# decifra giochi/cruciverba/episodi.enc e scrive in episodi.js solo gli episodi usciti.
name: Cruciverba settimanale

on:
  schedule:
    # Pronto prima delle 7, quando esce Rotatorie. Venerdi 04:17 UTC = 05:17 ora solare,
    # 06:17 ora legale; il secondo giro e una riserva se GitHub ritarda o salta il primo.
    - cron: "17 4 * * 5"
    - cron: "47 4 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrive gli episodi usciti
        env:
          CRUCIVERBA_CHIAVE: ${{ secrets.CRUCIVERBA_CHIAVE }}
        run: python3 giochi/cruciverba/pubblica.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add giochi/cruciverba/episodi.js
          git diff --cached --quiet && echo "Nessun episodio nuovo" && exit 0
          git commit -m "Cruciverba: nuovo episodio del venerdi"
          git push
